<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Candy Coven — quantum poker played with cursed coins and real candy. A Halloween reskin of SINTEF's Quantum Poker.">
<meta name="theme-color" content="#0b0713">
<title>Candy Coven — Quantum Poker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎃</text></svg>">
</head>
<body>

<div class="fog" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="embers" id="embers" aria-hidden="true"></div>

<!-- ============================ SETUP ============================ -->
<section id="screen-setup" class="screen">
  <div class="setup-card">
    <h1 class="brand">Candy<span>Coven</span></h1>
    <p class="tagline">Quantum poker, played for candy.<br>Land your coins face&#8209;up. Take the pile.</p>

    <div class="seat-list" id="seat-list"></div>

    <div class="setup-row">
      <button class="btn ghost" id="btn-remove-seat" type="button">− Player</button>
      <button class="btn ghost" id="btn-add-seat" type="button">+ Player</button>
    </div>

    <div class="setup-actions">
      <button class="btn primary big" id="btn-start" type="button">Deal me in</button>
      <button class="btn ghost" id="btn-tutorial" type="button">First time? 60-second tutorial</button>
      <button class="btn link" id="btn-rules-setup" type="button">How the candy works</button>
    </div>
  </div>
</section>

<!-- ============================ TABLE ============================ -->
<section id="screen-table" class="screen" hidden>
  <header class="topbar">
    <div class="topbar-left">
      <span class="round-name" id="round-name">The Summoning</span>
      <span class="blind-chip" id="blind-chip"></span>
    </div>
    <div class="pot" id="pot">
      <span class="pot-label">Pot</span>
      <strong id="pot-value">0</strong>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="btn-nerd" type="button" aria-pressed="false" title="Nerd mode: show the quantum states">ψ</button>
      <button class="icon-btn" id="btn-rules" type="button" title="How to play">?</button>
    </div>
  </header>

  <div class="table-felt">
    <div class="coin-row-wrap">
      <svg class="chain-layer" id="chain-layer" aria-hidden="true"></svg>
      <div class="coin-row" id="coin-row"></div>
    </div>
    <p class="coin-legend" id="coin-legend"></p>
  </div>

  <div class="players" id="players"></div>

  <p class="prompt" id="prompt" role="status" aria-live="polite"></p>

  <button class="handrail" id="handrail" type="button" hidden></button>

  <div class="actionbar" id="actionbar"></div>
</section>

<!-- ============================ OVERLAYS ============================ -->

<div class="overlay curtain" id="curtain" hidden>
  <div class="curtain-inner">
    <div class="curtain-avatar" id="curtain-avatar">🎃</div>
    <h2>Pass to <span id="curtain-name">—</span></h2>
    <p class="muted" id="curtain-sub">Everyone else, look away.</p>
    <button class="btn primary big" id="curtain-go" type="button">I'm ready</button>
  </div>
</div>

<div class="overlay" id="peek" hidden>
  <div class="sheet">
    <h2 class="sheet-title">Your cards</h2>
    <div class="hand-strip" id="peek-hand"></div>
    <p class="muted small" id="peek-sub"></p>
    <button class="btn primary" id="peek-close" type="button">Hide</button>
  </div>
</div>

<div class="overlay" id="showdown" hidden>
  <div class="sheet wide">
    <h2 class="sheet-title" id="showdown-title">Showdown</h2>
    <div id="showdown-body"></div>
    <div class="sheet-actions">
      <button class="btn ghost" id="showdown-skip" type="button">Skip</button>
      <button class="btn primary" id="showdown-next" type="button" hidden>Next hand</button>
    </div>
  </div>
</div>

<div class="overlay" id="bank" hidden>
  <div class="sheet wide">
    <h2 class="sheet-title">Settle up</h2>
    <p class="muted">Hand over the candy. This is what everyone walks away with.</p>
    <div id="bank-body"></div>
    <div class="sheet-actions">
      <button class="btn ghost" id="bank-close" type="button">Back</button>
      <button class="btn primary" id="bank-again" type="button">New game</button>
    </div>
  </div>
</div>

<div class="overlay" id="rules" hidden>
  <div class="sheet wide scroll">
    <h2 class="sheet-title">How to play</h2>
    <div class="rules-body" id="rules-body"></div>
    <div class="sheet-actions">
      <button class="btn primary" id="rules-close" type="button">Got it</button>
    </div>
  </div>
</div>

<div class="overlay tutorial" id="tutorial" hidden>
  <div class="sheet wide">
    <h2 class="sheet-title" id="tut-title">The coins</h2>
    <div class="coin-row tut-row" id="tut-coins"></div>
    <p class="tut-text" id="tut-text"></p>
    <div class="hand-strip" id="tut-hand"></div>
    <div class="sheet-actions">
      <button class="btn ghost" id="tut-quit" type="button">Skip tutorial</button>
      <button class="btn primary" id="tut-next" type="button">Next</button>
    </div>
  </div>
</div>

<pre id="test-out" hidden></pre>

<script src="js/quantum.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/tests.js"></script>
</body>
</html>
