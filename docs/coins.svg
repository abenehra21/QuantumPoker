<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="The states a qubit on the table can be in">
  <defs>
    <radialGradient id="gold" cx="34%" cy="28%">
      <stop offset="0%" stop-color="#ffeab6"/><stop offset="42%" stop-color="#e8a33d"/>
      <stop offset="74%" stop-color="#a66716"/><stop offset="100%" stop-color="#5e3607"/>
    </radialGradient>
    <radialGradient id="dark" cx="34%" cy="28%">
      <stop offset="0%" stop-color="#574a3c"/><stop offset="48%" stop-color="#352c23"/>
      <stop offset="100%" stop-color="#1a140f"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c4a0d"/><stop offset="26%" stop-color="#ffe5ab"/>
      <stop offset="54%" stop-color="#c98b23"/><stop offset="100%" stop-color="#6b3c07"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="meridian">
      <circle cx="50" cy="50" r="39" fill="none" stroke="currentColor" stroke-width="2.6" opacity=".5"/>
      <ellipse cx="50" cy="50" rx="15" ry="39" fill="none" stroke="currentColor" stroke-width="2" opacity=".32"/>
      <path d="M11 50 H89" stroke="currentColor" stroke-width="1.6" opacity=".22"/>
    </g>
    <g id="one"><use href="#meridian"/><path d="M38 33 L57 22 L57 78 L46 78 L46 39 Z"/><rect x="34" y="78" width="34" height="9" rx="1.5"/></g>
    <g id="zero"><use href="#meridian"/><path d="M50 20 c11 0 19 13 19 30 s-8 30-19 30 -19-13-19-30 8-30 19-30z M50 32 c-5 0-8 8-8 18 s3 18 8 18 8-8 8-18 -3-18-8-18z" fill-rule="evenodd"/></g>
  </defs>

  <rect width="960" height="300" rx="22" fill="#16271f"/>
  <rect x="1" y="1" width="958" height="298" rx="21" fill="none" stroke="#0d1813"/>

  <!-- settled on 1 -->
  <g transform="translate(60,58)" filter="url(#glow)">
    <circle cx="50" cy="50" r="50" fill="url(#gold)"/>
    <circle cx="50" cy="50" r="47" fill="none" stroke="#ffecb4" stroke-opacity=".5" stroke-width="3"/>
    <g transform="translate(11,11) scale(.78)" fill="#2a1c10" color="#2a1c10"><use href="#one"/></g>
  </g>
  <text x="110" y="192" text-anchor="middle" fill="#e8a33d" font-family="IM Fell English SC,Georgia,serif" font-size="19">Settled on 1</text>
  <text x="110" y="218" text-anchor="middle" fill="#b3a68b" font-family="Barlow Condensed,Helvetica,sans-serif" font-size="14">A point, banked</text>
  <text x="110" y="248" text-anchor="middle" fill="#9d6fa8" font-family="Barlow Condensed,Helvetica,sans-serif" font-size="15">|1⟩</text>

  <!-- settled on 0 -->
  <g transform="translate(240,58)">
    <circle cx="50" cy="50" r="50" fill="url(#dark)"/>
    <circle cx="50" cy="50" r="47" fill="none" stroke="#9682be" stroke-opacity=".25" stroke-width="3"/>
    <g transform="translate(11,11) scale(.78)" fill="#a2937c" color="#a2937c"><use href="#zero"/></g>
  </g>
  <text x="290" y="192" text-anchor="middle" fill="#e8a33d" font-family="IM Fell English SC,Georgia,serif" font-size="19">Settled on 0</text>
  <text x="290" y="218" text-anchor="middle" fill="#b3a68b" font-family="Barlow Condensed,Helvetica,sans-serif" font-size="14">Worth nothing — yet</text>
  <text x="290" y="248" text-anchor="middle" fill="#9d6fa8" font-family="Barlow Condensed,Helvetica,sans-serif" font-size="15">|0⟩</text>

  <!-- spinning clockwise -->
  <g transform="translate(420,58)">
    <ellipse cx="50" cy="50" rx="15" ry="50" fill="url(#gold)" opacity=".3"/>
    <rect x="46" y="2" width="8" height="96" rx="4" fill="url(#rim)"/>
    <path d="M18 18 A45 45 0 0 1 82 18" fill="none" stroke="#5cc5d8" stroke-width="3" stroke-linecap="round"/>
    <path d="M82 18 l-3 -11 l12 4 z" fill="#5cc5d8"/>
  </g>
  <text x="470" y="192" text-anchor="middle" fill="#e8a33d" font-family="IM Fell English SC,Georgia,serif" font-size="19">Spinning ↻</text>
  <text x="470" y="218" text-anchor="middle" fill="#b3a68b" font-family="Barlow Condensed,Helvetica,sans-serif" font-size="14">Superposition — even money</text>
  <text x="470" y="248" text-anchor="middle" fill="#5cc5d8" font-family="Barlow Condensed,Helvetica,sans-serif" font-size="15">|+⟩</text>

  <!-- spinning counter-clockwise -->
  <g transform="translate(600,58)">
    <ellipse cx="50" cy="50" rx="15" ry="50" fill="url(#gold)" opacity=".3"/>
    <rect x="46" y="2" width="8" height="96" rx="4" fill="url(#rim)"/>
    <path d="M82 18 A45 45 0 0 0 18 18" fill="none" stroke="#5cc5d8" stroke-width="3" stroke-linecap="round"/>
    <path d="M18 18 l3 -11 l-12 4 z" fill="#5cc5d8"/>
  </g>
  <text x="650" y="192" text-anchor="middle" fill="#e8a33d" font-family="IM Fell English SC,Georgia,serif" font-size="19">Spinning ↺</text>
  <text x="650" y="218" text-anchor="middle" fill="#b3a68b" font-family="Barlow Condensed,Helvetica,sans-serif" font-size="14">The other way round</text>
  <text x="650" y="248" text-anchor="middle" fill="#5cc5d8" font-family="Barlow Condensed,Helvetica,sans-serif" font-size="15">|−⟩</text>

  <!-- linked pair -->
  <g transform="translate(762,70)">
    <circle cx="36" cy="38" r="36" fill="url(#gold)" opacity=".92"/>
    <g transform="translate(36,38) scale(.56) translate(-50,-50)" fill="#2a1c10" color="#2a1c10"><use href="#one"/></g>
    <circle cx="126" cy="38" r="36" fill="url(#gold)" opacity=".92"/>
    <g transform="translate(126,38) scale(.56) translate(-50,-50)" fill="#2a1c10" color="#2a1c10"><use href="#one"/></g>
    <path d="M36 -2 Q81 -34 126 -2" fill="none" stroke="#63a98c" stroke-width="3.5"
          stroke-dasharray="8 7" stroke-linecap="round"/>
  </g>
  <text x="843" y="192" text-anchor="middle" fill="#e8a33d" font-family="IM Fell English SC,Georgia,serif" font-size="19">Linked</text>
  <text x="843" y="218" text-anchor="middle" fill="#b3a68b" font-family="Barlow Condensed,Helvetica,sans-serif" font-size="14">Entangled — they settle alike</text>
  <text x="843" y="248" text-anchor="middle" fill="#63a98c" font-family="Barlow Condensed,Helvetica,sans-serif" font-size="15">|00⟩ + |11⟩</text>
</svg>
